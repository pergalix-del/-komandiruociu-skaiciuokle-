# Vyriausybės nutarimo Nr. 526 patikra e-TAR: kasdien 08:57 Vilniaus laiku.
# Atsiradus naujai redakcijai skaičiuoklė rodo įspėjimą ir sukuriamas pranešimas (Issues).
name: Nutarimo Nr. 526 patikra

on:
  schedule:
    - cron: '57 8 * * *'
      timezone: 'Europe/Vilnius'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: duomenu-atnaujinimas
  cancel-in-progress: false

jobs:
  patikra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patikrinti e-TAR
        id: etar
        run: node scripts/check-etar.mjs
      - name: Įrašyti pakeitimus
        run: |
          git add data/rules.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nutarimo Nr. 526 patikra $(TZ=Europe/Vilnius date +%F)"
          git pull --rebase
          git push
      - name: Pranešti apie naują redakciją
        if: steps.etar.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Pasikeitė Vyriausybės nutarimas Nr. 526" --body-file etar-change.md
